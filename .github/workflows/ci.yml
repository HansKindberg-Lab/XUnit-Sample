name: "CI"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
      - name: "Setup .NET"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: "Restore dependencies"
        run: dotnet restore
      - name: "Build"
        run: dotnet build --no-restore --configuration Release
      - name: "Run tests"
        run: dotnet test --configuration Release --logger "console;verbosity=detailed" --logger "trx;LogFileName=test-results.trx" --no-build -- xUnit.Explicit=on
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "test-results-${{ matrix.os }}"
          path: "**/test-results.trx"